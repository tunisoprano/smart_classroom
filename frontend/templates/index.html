<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Akıllı Sınıf — Dijital İkiz</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:      #0b0f1a;
    --surface: #131929;
    --card:    #1a2237;
    --border:  #263050;
    --accent:  #3b82f6;
    --green:   #22c55e;
    --yellow:  #eab308;
    --red:     #ef4444;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --mono:    'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon { width: 34px; height: 34px; background: var(--accent); border-radius: 8px; display: grid; place-items: center; font-size: 17px; }
  .logo h1 { font-size: 16px; font-weight: 700; }
  .logo span { font-size: 11px; color: var(--muted); }
  .pill { display: flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 5px 13px; font-size: 12px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  main { padding: 20px 28px; max-width: 1380px; margin: 0 auto; }

  /* KPI */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; position: relative; overflow: hidden; }
  .kpi::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background: var(--accent); }
  .kpi.g::before { background: var(--green); }
  .kpi.y::before { background: var(--yellow); }
  .kpi.r::before { background: var(--red); }
  .kpi-label { font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); margin-bottom: 7px; }
  .kpi-value { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .kpi-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* 2-col layout */
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .row3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media(max-width:900px){ .row2,.row3 { grid-template-columns: 1fr; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .card-title { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 14px; }
  .chart-wrap { position: relative; height: 200px; }

  /* energy bars */
  .ebar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .ebar-label { font-size: 11px; color: var(--muted); width: 70px; flex-shrink: 0; }
  .ebar-bg { flex: 1; height: 9px; background: var(--border); border-radius: 5px; overflow: hidden; }
  .ebar-fill { height: 100%; border-radius: 5px; transition: width .7s ease; }
  .ebar-val { font-size: 11px; width: 65px; text-align: right; font-variant-numeric: tabular-nums; }

  /* bin gauge */
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0; }
  .gauge-bar { width: 60px; height: 140px; background: var(--border); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column-reverse; position: relative; border: 2px solid var(--border); }
  .gauge-fill { width: 100%; transition: height .7s ease; border-radius: 4px; }
  .gauge-val { font-size: 22px; font-weight: 700; }
  .gauge-label { font-size: 11px; color: var(--muted); }

  /* rules */
  .rules { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .rule { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 12px; }
  .rule-title { font-size: 11px; font-weight: 700; color: var(--accent); margin-bottom: 5px; }
  .rule-line { font-size: 11px; color: var(--muted); margin-bottom: 2px; font-family: var(--mono); }
  .rule-line b { color: var(--text); font-weight: 500; }

  /* alerts */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { padding: 8px 12px; background: var(--surface); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); text-align: left; }
  td { padding: 8px 12px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 10px; font-weight: 700; }
  .b-co2  { background: #7f1d1d; color: #fca5a5; }
  .b-temp { background: #7c2d12; color: #fdba74; }
  .b-bin  { background: #78350f; color: #fcd34d; }
  .b-warn { background: #713f12; color: #fef08a; }

  .no-data { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 50px; text-align: center; color: var(--muted); }
  .no-data code { display: inline-block; margin-top: 8px; background: var(--surface); padding: 5px 12px; border-radius: 5px; font-family: var(--mono); font-size: 12px; color: var(--green); }

  footer { text-align: center; padding: 18px; color: var(--muted); font-size: 11px; border-top: 1px solid var(--border); margin-top: 4px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🏫</div>
    <div>
      <h1>Akıllı Sınıf Dijital İkizi</h1>
      <span>Enerji Verimliliği &amp; Ortam Analizi</span>
    </div>
  </div>
  <div class="pill">
    <div class="dot" id="dot"></div>
    <span id="statusText">Yükleniyor…</span>
  </div>
</header>

<main id="app"><div class="no-data">Yükleniyor…</div></main>

<footer>DHT22 · MQ-135 · BH1750 · ACS712 · HC-SR04 · Threshold Controller · SQLite · Flask</footer>

<script>
const fmt  = (v, d=1) => v == null ? '—' : Number(v).toFixed(d);
const fmtT = s => {
  const h = Math.floor(s/3600)+9, m = Math.floor((s%3600)/60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
};
const badgeCls = t => t==='HIGH_CO2'?'b-co2':t==='HIGH_TEMP'?'b-temp':t==='BIN_FULL'?'b-bin':'b-warn';
const badgeTxt = t => t==='HIGH_CO2'?'Yüksek CO₂':t==='HIGH_TEMP'?'Yüksek Sıcaklık':t==='BIN_FULL'?'Kutu Dolu':'Uyarı';

async function load() {
  let sum, recent, alerts, energy;
  try {
    [sum, recent, alerts, energy] = await Promise.all([
      fetch('/api/summary').then(r=>r.json()),
      fetch('/api/data?limit=480').then(r=>r.json()),
      fetch('/api/alerts').then(r=>r.json()),
      fetch('/api/energy').then(r=>r.json()),
    ]);
  } catch {
    document.getElementById('app').innerHTML = `<div class="no-data">Flask sunucusuna bağlanılamıyor.<br><code>python backend/app.py</code></div>`;
    return;
  }

  if (!recent.length) {
    document.getElementById('app').innerHTML = `<div class="no-data">Veri yok. Simülasyonu çalıştırın.<br><code>python simulation/dijital_ikiz.py</code></div>`;
    return;
  }

  document.getElementById('dot').style.background = '#22c55e';
  document.getElementById('statusText').textContent = `${recent.length} kayıt · Son: ${fmtT(recent[recent.length-1].time)}`;

  const last = recent[recent.length-1];
  const sp   = sum.savings_pct || 0;
  const co2Color = last.co2 > 1000 ? 'var(--red)' : last.co2 > 700 ? 'var(--yellow)' : 'var(--green)';
  const tempColor = last.temperature > 28 ? 'var(--red)' : last.temperature > 25 ? 'var(--yellow)' : 'var(--text)';
  const binPct = Math.round(((last.trash_count||0) / 40) * 100);
  const binColor = binPct > 80 ? 'var(--red)' : binPct > 50 ? 'var(--yellow)' : 'var(--green)';

  document.getElementById('app').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Anlık Kişi</div><div class="kpi-value">${last.people}</div><div class="kpi-sub">Maks: ${sum.peak_occupancy} · Ort: ${fmt(sum.avg_occupancy)}</div></div>
      <div class="kpi y"><div class="kpi-label">CO₂</div><div class="kpi-value" style="color:${co2Color}">${fmt(last.co2,0)}</div><div class="kpi-sub">ppm · Ort: ${fmt(sum.avg_co2,0)}</div></div>
      <div class="kpi"><div class="kpi-label">Sıcaklık</div><div class="kpi-value" style="color:${tempColor}">${fmt(last.temperature)}°C</div><div class="kpi-sub">Nem: ${fmt(last.humidity,0)}%</div></div>
      <div class="kpi"><div class="kpi-label">Işık</div><div class="kpi-value">${fmt(last.light_lux,0)}</div><div class="kpi-sub">lux · ${last.light_zones}/4 bölge</div></div>
      <div class="kpi g"><div class="kpi-label">Tasarruf</div><div class="kpi-value" style="color:var(--green)">%${fmt(sp,1)}</div><div class="kpi-sub">${fmt(sum.savings_wh,0)} Wh</div></div>
      <div class="kpi"><div class="kpi-label">HVAC</div><div class="kpi-value" style="color:${last.hvac_on?'var(--accent)':'var(--muted)'}">${last.hvac_on?'AÇIK':'KAPALI'}</div><div class="kpi-sub">${sum.hvac_on_minutes||0} dk aktif</div></div>
    </div>

    <div class="row2">
      <div class="card"><div class="card-title">CO₂ Seviyesi (ppm)</div><div class="chart-wrap"><canvas id="cCO2"></canvas></div></div>
      <div class="card"><div class="card-title">Sıcaklık (°C)</div><div class="chart-wrap"><canvas id="cTemp"></canvas></div></div>
    </div>

    <div class="row3">
      <div class="card"><div class="card-title">Saatlik Enerji: Akıllı vs Klasik (Wh)</div><div class="chart-wrap"><canvas id="cEnergy"></canvas></div></div>
      <div class="card">
        <div class="card-title">Enerji Karşılaştırması</div>
        <div id="ebars" style="margin-top:8px"></div>
        <div style="margin-top:16px;background:var(--surface);border-radius:7px;padding:12px">
          <div style="font-size:11px;color:var(--muted)">Toplam Kazanım</div>
          <div style="font-size:22px;font-weight:700;color:var(--green);margin-top:4px">${fmt(sum.savings_wh,0)} Wh</div>
          <div style="font-size:11px;color:var(--muted);margin-top:2px">= ${fmt((sum.savings_wh||0)/1000,2)} kWh</div>
        </div>
      </div>
      <div class="card" style="display:flex;flex-direction:column;align-items:center">
        <div class="card-title" style="align-self:flex-start">Geri Dönüşüm Kutusu</div>
        <div class="gauge-wrap">
          <div class="gauge-bar">
            <div class="gauge-fill" style="height:${binPct}%;background:${binColor}"></div>
          </div>
          <div class="gauge-val" style="color:${binColor}">${binPct}%</div>
          <div class="gauge-label">${last.trash_count||0} / 40 atık</div>
          <div class="gauge-label">Toplam: ${sum.total_trashed||0}</div>
        </div>
      </div>
    </div>

    <div class="row2" style="margin-bottom:14px">
      <div class="card"><div class="card-title">Kişi Sayısı</div><div class="chart-wrap"><canvas id="cPeople"></canvas></div></div>
      <div class="card"><div class="card-title">Ortam Işığı (lux)</div><div class="chart-wrap"><canvas id="cLux"></canvas></div></div>
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="card-title">Eşik Tabanlı Karar Algoritması</div>
      <div class="rules">
        <div class="rule"><div class="rule-title">🌬️ HVAC</div>
          <div class="rule-line">AÇIL : CO₂ ≥ <b>1000 ppm</b></div>
          <div class="rule-line">AÇIL : Sıcaklık ≥ <b>26°C</b></div>
          <div class="rule-line">KAPAT: CO₂ ≤ <b>700 ppm</b> VE Sıcaklık ≤ <b>23°C</b></div>
          <div class="rule-line">Histerezis: <b>Aktif</b></div>
        </div>
        <div class="rule"><div class="rule-title">💡 Aydınlatma</div>
          <div class="rule-line">AÇIL : Bölge dolu + ışık &lt; <b>300 lux</b></div>
          <div class="rule-line">KAPAT: Bölge boş</div>
          <div class="rule-line">KAPAT: Işık ≥ <b>500 lux</b></div>
          <div class="rule-line">Bölge kapasitesi: <b>10 kişi</b></div>
        </div>
        <div class="rule"><div class="rule-title">📡 Sensörler</div>
          <div class="rule-line">DHT22 → Sıcaklık <b>±0.5°C</b></div>
          <div class="rule-line">MQ-135 → CO₂ <b>±15 ppm</b></div>
          <div class="rule-line">BH1750 → Işık <b>±8%</b></div>
          <div class="rule-line">ACS712 → Akım <b>±50 mA</b></div>
        </div>
        <div class="rule"><div class="rule-title">⚡ Güç</div>
          <div class="rule-line">LED bölge: <b>18 W</b></div>
          <div class="rule-line">HVAC: <b>2200 W</b></div>
          <div class="rule-line">Şebeke: <b>220 V</b></div>
          <div class="rule-line">Sınıf hacmi: <b>144 m³</b></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Sistem Uyarıları (${alerts.length})</div>
      <div style="overflow-x:auto">
        <table><thead><tr><th>Zaman</th><th>Tür</th><th>Mesaj</th></tr></thead>
        <tbody id="atbody"></tbody></table>
      </div>
    </div>
  `;

  // alerts
  const tb = document.getElementById('atbody');
  if (!alerts.length) tb.innerHTML = '<tr><td colspan="3" style="color:var(--muted);text-align:center">Uyarı yok</td></tr>';
  else alerts.slice(0,40).forEach(a => {
    tb.innerHTML += `<tr><td>${fmtT(a.time)}</td><td><span class="badge ${badgeCls(a.alert_type)}">${badgeTxt(a.alert_type)}</span></td><td>${a.message}</td></tr>`;
  });

  // energy bars
  const sw = sum.smart_energy_wh||0, cw = sum.classic_energy_wh||1;
  document.getElementById('ebars').innerHTML = `
    <div class="ebar"><div class="ebar-label">Klasik</div><div class="ebar-bg"><div class="ebar-fill" style="width:100%;background:var(--red)"></div></div><div class="ebar-val">${fmt(cw,0)} Wh</div></div>
    <div class="ebar"><div class="ebar-label">Akıllı</div><div class="ebar-bg"><div class="ebar-fill" style="width:${(sw/cw*100).toFixed(1)}%;background:var(--green)"></div></div><div class="ebar-val">${fmt(sw,0)} Wh</div></div>
    <div class="ebar"><div class="ebar-label">Tasarruf</div><div class="ebar-bg"><div class="ebar-fill" style="width:${sp}%;background:var(--accent)"></div></div><div class="ebar-val" style="color:var(--green)">%${fmt(sp,1)}</div></div>
  `;

  // charts
  const rev = recent;  // API artık ASC sıralı döndürüyor
  const lbls = rev.map(r => fmtT(r.time));
  const co = { responsive:true, maintainAspectRatio:false, animation:{duration:400},
    plugins:{legend:{display:false}},
    scales:{x:{ticks:{color:'#64748b',maxTicksLimit:8,font:{size:9}},grid:{color:'#263050'}},
            y:{ticks:{color:'#64748b',font:{size:9}},grid:{color:'#263050'}}} };

  new Chart(document.getElementById('cCO2'), { type:'line', data:{ labels:lbls,
    datasets:[{data:rev.map(r=>r.co2), borderColor:'#eab308', backgroundColor:'rgba(234,179,8,.08)', fill:true, tension:.3, pointRadius:0, borderWidth:2}]}, options:{...co,scales:{...co.scales,y:{...co.scales.y,min:400}}} });

  new Chart(document.getElementById('cTemp'), { type:'line', data:{ labels:lbls,
    datasets:[{data:rev.map(r=>r.temperature), borderColor:'#f97316', backgroundColor:'rgba(249,115,22,.08)', fill:true, tension:.3, pointRadius:0, borderWidth:2}]}, options:co });

  new Chart(document.getElementById('cPeople'), { type:'bar', data:{ labels:lbls,
    datasets:[{data:rev.map(r=>r.people), backgroundColor:'rgba(59,130,246,.45)', borderColor:'#3b82f6', borderWidth:1, borderRadius:2}]}, options:co });

  new Chart(document.getElementById('cLux'), { type:'line', data:{ labels:lbls,
    datasets:[{data:rev.map(r=>r.light_lux), borderColor:'#facc15', backgroundColor:'rgba(250,204,21,.07)', fill:true, tension:.3, pointRadius:0, borderWidth:2}]}, options:co });

  // hourly energy
  const el = energy.map(e=>`${e.hour_idx+9}:00`);
  const CLASSIC_H = 4*18 + 2200;
  new Chart(document.getElementById('cEnergy'), { type:'bar', data:{ labels:el,
    datasets:[
      {label:'Akıllı (Wh)', data:energy.map(e=>e.smart_avg_wh), backgroundColor:'rgba(34,197,94,.45)', borderColor:'#22c55e', borderWidth:1, borderRadius:3},
      {label:'Klasik (Wh)', data:energy.map(()=>CLASSIC_H),     backgroundColor:'rgba(239,68,68,.3)',  borderColor:'#ef4444', borderWidth:1, borderRadius:3}
    ]},
    options:{...co, plugins:{legend:{display:true,labels:{color:'#64748b',font:{size:10}}}}} });
}

load();
setInterval(load, 30000);
</script>
</body>
</html>
